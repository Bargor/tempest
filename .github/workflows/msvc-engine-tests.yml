name: msvc-engine-tests
on: [push]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
        engine: [Vk, GL]
    steps:
    - name: checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2
    - name: install vulkan
      if: ${{ matrix.engine == 'Vk' }}
      run: | 
        curl -L --show-error --output VulkanSDK.exe https://vulkan.lunarg.com/sdk/download/1.3.296.0/windows/VulkanSDK-1.3.296.0-Installer.exe?Human=true
        dir
        D:\a\tempest\tempest\VulkanSDK.exe /S
    - name: config CMake
      env:
        BUILD_TYPE: ${{ matrix.build_type }}
        ENGINE: ${{ matrix.engine }}
        VULKAN_SDK: C:\VulkanSDK\1.3.296.0
      run: |
        cmake -G"Visual Studio 17 2022" "-Ax64" . -DTEMPEST_BUILD_ALL=ON -DENGINE=${{ matrix.engine }}
    - name: build
      run: |
          cd D:/a/tempest/tempest
          msbuild tempest.sln /t:Build /p:Configuration=${{ matrix.build_type }};